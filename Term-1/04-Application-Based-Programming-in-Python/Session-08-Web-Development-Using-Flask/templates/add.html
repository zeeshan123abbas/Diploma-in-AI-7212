{% extends "base.html" %}
{% block content %}
  <h1>{{ title }}</h1>
  {% if message %}<p class="msg">{{ message }}</p>{% endif %}
  <form method="post">
    <label>Name <input name="name" required></label>
    <label>Marks <input name="marks" type="number" min="0" max="100" required></label>
    <button type="submit">Save</button>
  </form>
{% endblock %}
